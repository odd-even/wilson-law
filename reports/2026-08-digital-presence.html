                width: 100%;
                max-width: 26rem;
                padding: 0 1.25rem;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: rgba(255, 255, 255, 0.06);
                border: 0.5px solid rgba(255, 255, 255, 0.18);
                border-radius: 20px;
                max-width: 26rem;
                margin: 0 auto;
                padding: 2rem 1.5rem;
                text-align: center;
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                color: #fff;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                font-size: 15px;
                font-family: "Poppins", system-ui, sans-serif;
                color: #fff;
                outline: 0;
                padding: 15px 40px 15px 15px;
                width: 100%;
            }

            .staticrypt-form input::placeholder {
                color: rgba(255, 255, 255, 0.35);
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: rgba(255, 255, 255, 0.08);
                width: 100%;
                border: 0.5px solid rgba(255, 255, 255, 0.18);
                border-radius: 999px;
                margin: 0 0 15px;
                box-sizing: border-box;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                opacity: 50%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 18px;
                filter: invert(1);
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: uppercase;
                outline: 0;
                background: #fff;
                width: 100%;
                border: 1px solid #fff;
                border-radius: 999px;
                padding: 15px;
                color: #000;
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.06em;
                font-family: "Poppins", system-ui, sans-serif;
                cursor: pointer;
                transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #000;
                color: #fff;
                border-color: #fff;
                filter: none;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin: 0;
                padding: 2rem 0;
                background:
                  radial-gradient(ellipse 55% 70% at 85% 20%, rgba(84, 171, 229, 0.28), transparent 60%),
                  radial-gradient(ellipse 45% 55% at 10% 85%, rgba(105, 214, 173, 0.16), transparent 55%),
                  #000000;
                font-family: "Poppins", system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: #fff;
            }

            .staticrypt-instructions {
                margin: 0 0 0.25rem;
            }

            .staticrypt-instructions p {
                margin: 0 0 0.65rem;
                font-weight: 300;
                color: rgba(255, 255, 255, 0.55);
                line-height: 1.5;
                font-size: 0.9rem;
            }

            .staticrypt-title {
                font-size: 1.35rem !important;
                font-weight: 600 !important;
                letter-spacing: -0.02em;
                color: #fff !important;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1em;
                font-size: 0.82rem;
                color: rgba(255, 255, 255, 0.45);
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.15);
                margin-right: 0.55em;
                accent-color: #54abe5;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid rgba(255, 255, 255, 0.2);
                border-right-color: #54abe5;
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>
